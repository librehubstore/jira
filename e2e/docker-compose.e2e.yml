# Throw-away stack for end-to-end tests: fresh database every run, app on port 18080.
name: fluxo-e2e
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fluxo
      POSTGRES_USER: fluxo
      POSTGRES_PASSWORD: fluxo
    tmpfs: /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fluxo"]
      interval: 2s
      retries: 30
  app:
    image: fluxo:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLUXO_DB_URL: jdbc:postgresql://db:5432/fluxo
      FLUXO_SECRET: e2e-secret-not-for-production
    ports:
      - "18080:8080"
